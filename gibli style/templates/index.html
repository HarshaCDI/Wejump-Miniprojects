<!DOCTYPE html>
<html>
  <head><title>Ghibli-Style Generator</title></head>
  <body>
    <h1>Upload an Image to Transform into Ghibli Style</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="image" accept="image/*" required><br>
      <input type="text" name="prompt" placeholder="Optional prompt"><br>
      <button type="submit">Generate</button>
    </form>
  </body>
</html>
